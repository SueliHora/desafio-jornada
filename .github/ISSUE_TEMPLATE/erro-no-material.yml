name: Erro no material do desafio
description: Link quebrado, erro de digitação, instrução confusa ou contradição no enunciado.
title: "[Erro] "
labels: ["material"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar. Se você já sabe como corrigir, um **pull request** é ainda mais bem-vindo do que uma issue — e conta como contribuição no seu perfil.

  - type: input
    id: onde
    attributes:
      label: Onde está o erro
      description: Arquivo e, se possível, a seção ou o número da linha.
      placeholder: "COMO-SUBMETER.md, seção 'Modelo do cartão'"
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: Qual é o erro
      description: O que está escrito hoje e por que está errado ou confuso.
    validations:
      required: true

  - type: textarea
    id: sugestao
    attributes:
      label: Sugestão de correção (opcional)
      description: Se tiver uma proposta de texto, escreva aqui.
