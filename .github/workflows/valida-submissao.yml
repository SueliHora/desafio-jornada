name: Valida submissão

# Roda em todo PR para a main. Confere só a estrutura do cartão:
# quem decide se o projeto entra na galeria continua sendo a revisão humana.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  estrutura:
    name: estrutura-do-cartao
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lista os arquivos alterados no PR
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > alterados.txt
          echo "Arquivos alterados neste PR:"
          cat alterados.txt

      - name: Valida a estrutura do cartão
        run: python .github/scripts/valida_submissao.py alterados.txt
