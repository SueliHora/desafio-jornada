name: Atualiza o mural de projetos

# Roda depois que um cartão entra na main e reescreve o PROJETOS.md a partir
# das pastas de cartão. O aluno nunca edita o mural: ele só envia a pasta dele.
on:
  push:
    branches: [main]
    paths:
      - "*/projetos/**"
      - ".github/scripts/gera_projetos.py"
      - ".github/scripts/cartao.py"
  workflow_dispatch:

permissions:
  contents: write

# Dois merges seguidos não podem gerar o mural ao mesmo tempo, senão o segundo
# push falha por estar atrás. A fila resolve sem ninguém precisar reexecutar.
concurrency:
  group: mural-projetos
  cancel-in-progress: false

jobs:
  mural:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Prepara o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera o PROJETOS.md
        run: python .github/scripts/gera_projetos.py

      - name: Commita se o mural mudou
        run: |
          if git diff --quiet -- PROJETOS.md; then
            echo "Mural já estava em dia. Nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJETOS.md
          git commit -m "chore: atualiza o mural de projetos [skip ci]"
          git pull --rebase origin main
          git push
